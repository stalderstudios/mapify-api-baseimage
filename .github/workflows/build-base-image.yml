name: Build and Push Base Image

on:
  schedule:
    - cron: '0 0 */14 * *'  # Runs every 14 days
  workflow_dispatch:  # Allows manual triggering from the Actions tab
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch
    paths:
      - 'Dockerfile'  # Only trigger if the Dockerfile is changed
      - '.github/workflows/*.yml'  # Also trigger if this workflow file changes

permissions: write-all

jobs:
  build:
    strategy:
      matrix:
        include:
          # Two separate native builds instead of one multi-platform build - QEMU emulation for
          # the non-native leg was both slow (~27min) and has been flaky for FrankenPHP specifically
          # in the past. GitHub's arm64-hosted runners (free on public repos) let both architectures
          # build natively, so each image only ever runs on the hardware it was actually built for.
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Packages
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get the date and commit hash
      run: |
        echo "BUILD_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
        echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c 1-7)" >> "$GITHUB_ENV"

    - name: Build and Push Docker image (native ${{ matrix.arch }}, no emulation)
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: true
        tags: |
          ghcr.io/stalderstudios/mapify-api-baseimage:${{ matrix.arch }}-latest
          ghcr.io/stalderstudios/mapify-api-baseimage:${{ matrix.arch }}-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
